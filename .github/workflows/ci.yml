# .github/workflows/ci.yml

name: CI

# Run on pushes and pull requests
on: [push, pull_request]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 went end-of-life on 2026-04-30 and stopped receiving
          # security patches. 22 is the active LTS and what Expo SDK 53
          # supports.
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check public env guardrail
        run: yarn workspace mobile-app check:public-env

      - name: Check admin web-only guardrail
        run: yarn workspace mobile-app check:admin-web-only

      - name: Check external API usage guardrail
        run: yarn workspace mobile-app check:external-api

      - name: Run tests
        run: yarn workspace mobile-app test --ci --runInBand

      - name: Run linter
        run: yarn workspace mobile-app lint

      # ESLint ignores scripts/, so its prettier/prettier rule never reached the
      # guardrail scripts and they drifted out of Prettier style unnoticed.
      # prettier --check covers everything the linter does not.
      - name: Check formatting
        run: yarn workspace mobile-app format:check

      - name: TypeScript check
        run: yarn workspace mobile-app typecheck
